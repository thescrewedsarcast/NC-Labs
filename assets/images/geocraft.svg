<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="12" fill="#0A101D"/>
  
  <!-- Topological contours -->
  <path d="M 60 220 Q 180 140 280 200 T 540 180" stroke="#0284C7" stroke-width="2" fill="none"/>
  <path d="M 60 250 Q 200 180 320 230 T 540 210" stroke="#0EA5E9" stroke-width="2.5" fill="none"/>
  <path d="M 60 280 Q 220 220 360 260 T 540 240" stroke="#38BDF8" stroke-width="2" fill="none"/>

  <!-- Polygonal mesh tiles / GeoJSON boundaries -->
  <polygon points="180,80 280,60 340,110 260,160 140,130" stroke="#38BDF8" stroke-width="2" fill="#0C4A6E" fill-opacity="0.3"/>
  <polygon points="280,60 420,50 460,120 340,110" stroke="#60A5FA" stroke-width="1.8" fill="#1E3A8A" fill-opacity="0.25"/>
  <polygon points="260,160 340,110 410,170 330,220 220,200" stroke="#38BDF8" stroke-width="2" fill="#0284C7" fill-opacity="0.35"/>

  <!-- Pin coordinates -->
  <circle cx="340" cy="110" r="5" fill="#F43F5E"/>
  <circle cx="340" cy="110" r="10" stroke="#F43F5E" stroke-width="1.5" opacity="0.6"/>

  <rect x="24" y="24" width="105" height="28" rx="6" fill="#141C2D" stroke="#25324E" stroke-width="1"/>
  <text x="36" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">GEOSPATIAL</text>
</svg>
