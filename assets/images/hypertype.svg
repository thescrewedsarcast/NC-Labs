<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="12" fill="#121016"/>
  
  <!-- Typographic baseline and grid -->
  <line x1="60" y1="90" x2="540" y2="90" stroke="#2D2335" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="60" y1="230" x2="540" y2="230" stroke="#E11D48" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="270" x2="540" y2="270" stroke="#2D2335" stroke-width="1.5"/>

  <!-- Large stylized ligature / serif glyph 'Aa' & 'g' -->
  <text x="70" y="230" fill="#F43F5E" font-family="Georgia, serif" font-size="160" font-weight="900" opacity="0.95">A</text>
  <text x="210" y="230" fill="#FDA4AF" font-family="Georgia, serif" font-size="130" font-weight="300" font-style="italic">a</text>
  <text x="310" y="260" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="120" font-weight="800">g</text>

  <!-- Variable axis sliders mockup -->
  <g transform="translate(440, 110)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#334155" stroke-width="3"/>
    <circle cx="55" cy="0" r="5" fill="#F43F5E"/>
    <line x1="0" y1="25" x2="80" y2="25" stroke="#334155" stroke-width="3"/>
    <circle cx="25" cy="25" r="5" fill="#FDA4AF"/>
    <line x1="0" y1="50" x2="80" y2="50" stroke="#334155" stroke-width="3"/>
    <circle cx="70" cy="50" r="5" fill="#F43F5E"/>
  </g>

  <rect x="24" y="24" width="115" height="28" rx="6" fill="#1F1522" stroke="#38253E" stroke-width="1"/>
  <text x="36" y="42" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">TYPOGRAPHY</text>
</svg>
