<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="12" fill="#0D0F18"/>
  
  <!-- Modular synth patch cords and oscilloscope -->
  <circle cx="120" cy="180" r="44" stroke="#2D3748" stroke-width="4" fill="#141824"/>
  <circle cx="120" cy="180" r="14" fill="#F59E0B"/>
  <line x1="120" y1="180" x2="148" y2="152" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>

  <circle cx="480" cy="180" r="44" stroke="#2D3748" stroke-width="4" fill="#141824"/>
  <circle cx="480" cy="180" r="14" fill="#EC4899"/>
  <line x1="480" y1="180" x2="455" y2="205" stroke="#EC4899" stroke-width="4" stroke-linecap="round"/>

  <!-- Oscilloscope Sine / Wavetable -->
  <path d="M 60 90 Q 120 20, 180 90 T 300 90 T 420 90 T 540 90" stroke="#06B6D4" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M 60 270 Q 120 200, 180 270 T 300 270 T 420 270 T 540 270" stroke="#F59E0B" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- Patch cable arc -->
  <path d="M 120 180 C 180 320, 420 320, 480 180" stroke="#EC4899" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 120 180 C 200 60, 400 60, 480 180" stroke="#F59E0B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- Center visualizer bars -->
  <g fill="#38BDF8" opacity="0.85">
    <rect x="250" y="160" width="8" height="40" rx="4"/>
    <rect x="264" y="140" width="8" height="80" rx="4"/>
    <rect x="278" y="125" width="8" height="110" rx="4"/>
    <rect x="292" y="110" width="8" height="140" rx="4"/>
    <rect x="306" y="120" width="8" height="120" rx="4"/>
    <rect x="320" y="135" width="8" height="90" rx="4"/>
    <rect x="334" y="155" width="8" height="50" rx="4"/>
  </g>

  <rect x="24" y="24" width="100" height="28" rx="6" fill="#141C2D" stroke="#25324E" stroke-width="1"/>
  <text x="36" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SYNTHESIS</text>
</svg>
