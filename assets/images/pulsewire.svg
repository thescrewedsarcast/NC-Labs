<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="12" fill="#0A0E1A"/>
  
  <!-- Glowing waveform & waterfall telemetry bars -->
  <defs>
    <linearGradient id="pwGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="85%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Spans / waterfall timeline -->
  <g opacity="0.9">
    <rect x="60" y="80" width="480" height="18" rx="4" fill="#1E293B"/>
    <rect x="60" y="80" width="320" height="18" rx="4" fill="#06B6D4" opacity="0.85"/>
    
    <rect x="120" y="112" width="220" height="14" rx="3" fill="#10B981" opacity="0.9"/>
    <rect x="260" y="136" width="180" height="14" rx="3" fill="#3B82F6" opacity="0.85"/>
    <rect x="360" y="160" width="140" height="14" rx="3" fill="#8B5CF6" opacity="0.85"/>
    <rect x="460" y="184" width="80" height="14" rx="3" fill="#EC4899" opacity="0.9"/>
  </g>

  <!-- Signal Pulse Waveform at bottom -->
  <path d="M 50 280 L 160 280 L 190 230 L 220 320 L 250 250 L 270 300 L 300 280 L 410 280 L 430 210 L 460 330 L 480 270 L 550 280" 
        stroke="url(#pwGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <circle cx="430" cy="210" r="4.5" fill="#EC4899"/>
  <circle cx="190" cy="230" r="4.5" fill="#06B6D4"/>

  <rect x="24" y="24" width="105" height="28" rx="6" fill="#141C2D" stroke="#25324E" stroke-width="1"/>
  <text x="36" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">TELEMETRY</text>
</svg>
