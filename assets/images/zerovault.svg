<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="12" fill="#090E17"/>
  
  <!-- Cryptographic shielding & hex lattice -->
  <g stroke="#1E293B" stroke-width="1.2" opacity="0.5">
    <polygon points="300,50 380,95 380,185 300,230 220,185 220,95"/>
    <polygon points="300,90 350,118 350,175 300,203 250,175 250,118"/>
    <polygon points="440,130 500,165 500,235 440,270 380,235 380,165"/>
    <polygon points="160,130 220,165 220,235 160,270 100,235 100,165"/>
  </g>

  <!-- Glowing vault lock / shield emblem -->
  <path d="M 300 100 C 335 100 360 120 360 160 C 360 220 300 260 300 260 C 300 260 240 220 240 160 C 240 120 265 100 300 100 Z" 
        stroke="#10B981" stroke-width="4" fill="#0E231F" fill-opacity="0.8"/>
  
  <!-- Keyhole cipher -->
  <circle cx="300" cy="165" r="14" fill="#10B981"/>
  <polygon points="293,172 307,172 312,205 288,205" fill="#10B981"/>

  <!-- Matrix-style binary streams -->
  <text x="70" y="320" fill="#047857" font-family="monospace" font-size="12" letter-spacing="4">AES-256-GCM // 0x4F9B7A21</text>
  <text x="380" y="320" fill="#047857" font-family="monospace" font-size="12" letter-spacing="4">PBKDF2 SHA-512</text>

  <rect x="24" y="24" width="85" height="28" rx="6" fill="#141C2D" stroke="#25324E" stroke-width="1"/>
  <text x="36" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CRYPTO</text>
</svg>
