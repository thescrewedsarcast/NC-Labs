<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="12" fill="#0C131F"/>
  
  <!-- Chrono dial / gauge -->
  <circle cx="190" cy="190" r="90" stroke="#1E293B" stroke-width="8" fill="#0A0E17"/>
  <circle cx="190" cy="190" r="90" stroke="#F59E0B" stroke-width="8" stroke-dasharray="380" stroke-dashoffset="120" stroke-linecap="round"/>
  <text x="155" y="195" fill="#F8FAFC" font-family="monospace" font-size="28" font-weight="700">0.42</text>
  <text x="165" y="220" fill="#94A3B8" font-family="monospace" font-size="14">μs / op</text>

  <!-- Flamechart bars on right -->
  <g fill="#F59E0B" opacity="0.9">
    <rect x="330" y="110" width="210" height="18" rx="3" fill="#EF4444"/>
    <rect x="330" y="136" width="130" height="18" rx="3" fill="#F59E0B"/>
    <rect x="470" y="136" width="70" height="18" rx="3" fill="#10B981"/>
    <rect x="330" y="162" width="75" height="18" rx="3" fill="#3B82F6"/>
    <rect x="415" y="162" width="45" height="18" rx="3" fill="#8B5CF6"/>
    <rect x="470" y="162" width="30" height="18" rx="3" fill="#06B6D4"/>
    <rect x="330" y="188" width="180" height="18" rx="3" fill="#10B981"/>
    <rect x="330" y="214" width="95" height="18" rx="3" fill="#F59E0B"/>
    <rect x="435" y="214" width="80" height="18" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Tick marks -->
  <line x1="330" y1="245" x2="540" y2="245" stroke="#334155" stroke-width="1.5"/>
  <text x="330" y="262" fill="#64748B" font-family="monospace" font-size="11">0ms</text>
  <text x="515" y="262" fill="#64748B" font-family="monospace" font-size="11">10ms</text>

  <rect x="24" y="24" width="110" height="28" rx="6" fill="#1A202C" stroke="#2D3748" stroke-width="1"/>
  <text x="36" y="42" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">BENCHMARK</text>
</svg>
